name: release

# The portable builds: a zip for macOS (Apple Silicon and Intel) and Windows,
# an AppImage for Linux, each built on its own system with a .sha256 beside it.
# Each is then unpacked and run with nothing of the development setup around
# it, and updates itself to a later version (tests/package, as in folio). A tag
# `v<version>` publishes them with their provenance; on a pull request touching
# the packaging the same builds and checks run and nothing is published.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - electron-builder.yml
      - .github/workflows/release.yml
      - scripts/checksums.mjs
      - src/main/dataDir.ts
      - src/main/update.ts
      - tests/package/**
      - playwright.package.config.ts

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "package.json says $version, the tag $GITHUB_REF_NAME"; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the archives
        run: pnpm dist
      - name: Checksums
        run: node scripts/checksums.mjs release

      - name: Run the macOS build (Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          zip="$(ls release/shell-*-mac-arm64.zip)"
          mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k "$zip" "$RUNNER_TEMP/app"
          SHELL_APP="$RUNNER_TEMP/app/shell.app/Contents/MacOS/shell" SHELL_ARCHIVE="$PWD/$zip" \
            pnpm exec playwright test -c playwright.package.config.ts

      - name: Run the Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem release\shell-*-win-x64.zip).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'app'
          New-Item -ItemType Directory -Force $dir | Out-Null
          tar -xf $zip -C $dir
          $env:SHELL_APP = Join-Path $dir 'shell.exe'
          $env:SHELL_ARCHIVE = $zip
          pnpm exec playwright test -c playwright.package.config.ts

      # No FUSE on the runner: the AppImage unpacks itself and runs.
      - name: Run the Linux build
        if: runner.os == 'Linux'
        run: |
          image="$(ls release/shell-*-linux-x64.AppImage)"
          mkdir -p "$RUNNER_TEMP/app"
          cp "$image" "$RUNNER_TEMP/app/shell.AppImage"
          chmod +x "$RUNNER_TEMP/app/shell.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 SHELL_APP="$RUNNER_TEMP/app/shell.AppImage" APPIMAGE_FILE="$RUNNER_TEMP/app/shell.AppImage" SHELL_ARCHIVE="$PWD/$image" \
            xvfb-run --auto-servernum pnpm exec playwright test -c playwright.package.config.ts
      - name: Attest what was built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/shell-*.zip
            release/shell-*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-${{ runner.os }}
          path: |
            release/shell-*.zip
            release/shell-*.AppImage
            release/shell-*.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: package-results-${{ runner.os }}
          path: test-results

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shell-*
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > notes.md
          import os, re, pathlib
          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          lines = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').split('\n')
          heads = [(i, line) for i, line in enumerate(lines) if line.startswith('## ')]
          for index, (start, line) in enumerate(heads):
              if re.match(r'^## \[?' + re.escape(version) + r'\]?( |$)', line):
                  end = heads[index + 1][0] if index + 1 < len(heads) else len(lines)
                  print('\n'.join(lines[start + 1:end]).strip())
                  break
          else:
              raise SystemExit(f'CHANGELOG.md says nothing about {version}')
          PY
          printf '\n---\n\nUnpack and run, no installer. Each archive has a `.sha256` beside it; provenance: `gh attestation verify <archive> --repo %s`.\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "shell $GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
