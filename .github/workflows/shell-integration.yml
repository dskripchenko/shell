name: shell-integration

# @dskripchenko/shell-integration to npm: a tag `shell-integration-v<version>`
# (the version in packages/shell-integration/package.json) publishes it, with provenance.
on:
  push:
    tags: ['shell-integration-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag is the package's version
        run: |
          want="${GITHUB_REF_NAME#shell-integration-v}"
          have="$(node -p "require('./packages/shell-integration/package.json').version")"
          test "$want" = "$have" || { echo "tag $want, package $have"; exit 1; }
      - run: pnpm vitest run tests/unit/shellIntegration.spec.ts tests/unit/agentEdits.spec.ts
      - run: pnpm --filter @dskripchenko/shell-integration build
      # Provenance by the environment: pnpm does not pass --provenance on to npm.
      - run: pnpm --filter @dskripchenko/shell-integration publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
