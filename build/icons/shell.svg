<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- body -->
  <rect x="100" y="116" width="824" height="824" rx="185" fill="#000000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <!-- tabs: three squares of colour, as the window's tabs show them -->
  <rect x="236" y="236" width="64" height="64" rx="14" fill="#2dd4bf"/>
  <rect x="332" y="236" width="64" height="64" rx="14" fill="#60a5fa"/>
  <rect x="428" y="236" width="64" height="64" rx="14" fill="#fbbf24"/>
  <rect x="236" y="348" width="552" height="10" rx="5" fill="#ffffff" opacity="0.10"/>

  <!-- the prompt and the cursor -->
  <path d="M270 470 L420 600 L270 730" fill="none" stroke="#2dd4bf" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#glow)"/>
  <path d="M270 470 L420 600 L270 730" fill="none" stroke="#2dd4bf" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="480" y="686" width="230" height="64" rx="16" fill="#f4f4f5"/>
</svg>
